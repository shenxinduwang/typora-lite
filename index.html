<!DOCTYPE html>
<html lang="zh" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Typora-Lite</title>
  </head>
  <body>
    <div id="toolbar">
      <div class="tb-group">
        <button id="btn-outline" class="tb-btn" title="大纲 (Ctrl+Shift+O)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
        </button>
        <button id="btn-recent" class="tb-btn" title="最近打开的文件">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        </button>
      </div>
      <span id="filename" class="muted">未命名.md</span>
      <div class="tb-group">
        <button id="btn-new" class="tb-btn" title="新建 (Ctrl+N)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 13v6M9 16h6"/></svg>
        </button>
        <button id="btn-open" class="tb-btn" title="打开 (Ctrl+O)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </button>
        <button id="btn-save" class="tb-btn" title="保存 (Ctrl+S)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
        </button>
        <button id="btn-more" class="tb-btn" title="更多设置">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
        </button>
      </div>
    </div>
    <div id="more-menu" class="hidden">
      <div id="mi-autosave" class="rm-item" title="每 30 秒自动保存到文件">自动保存</div>
      <div id="mi-theme" class="rm-item" title="切换亮/暗/跟随系统">主题：自动</div>
    </div>
    <div id="main">
      <div id="outline" class="hidden">
        <div id="outline-list"></div>
      </div>
      <div id="editor"></div>
    </div>
    <div id="toast" role="status"></div>
    <div id="recent-menu" class="hidden"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
